[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpvectordb"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp",
    "lancedb",
    "fastembed",
    "transformers",
    "markitdown[all]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "numpy",
    "onnx>=1.20.1",
    "onnxruntime>=1.20.1",
]

[project.scripts]
mcpvectordb = "mcpvectordb.server:main"
mcpvectordb-download-model = "mcpvectordb._download_model:main"
mcpvectordb-ingest = "mcpvectordb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpvectordb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-m 'not slow' --cov=src/mcpvectordb --cov-report=term-missing --cov-fail-under=80"
markers = [
    "slow: audio transcription, image OCR, embedding model load (deselected by default)",
    "integration: writes to real (tmp) LanceDB on disk",
    "unit: pure functions — no I/O, no filesystem, no network",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# ANN = type hints on public signatures; D1xx/D4xx = docstrings on public API.
# Both are required by /workspace/.claude/rules/master-code-style.md — selected here
# so the rule is enforced by the linter, not only asserted in prose.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "D100", "D101", "D102", "D103", "D104", "D400", "D415"]
# ANN401: bans typing.Any outright. The style rule requires annotations, not the
# absence of Any, so this stays off.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "lancedb",
    "fastembed",
    "markitdown",
    "pyarrow",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-httpx",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "bandit",
    "pyinstaller>=6.0",
]
